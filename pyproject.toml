[project]
name = "js-source-maps-decoder"
version = "1.0.0"
description = "JavaScript Source Maps Decoder"
authors = [
    { name = "Danil Ovchinnikov", email = "Danil42Worker@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "requests>=2.34.2",
]

[project.urls]
Repository = "https://github.com/DanilBox/JavaScript-Source-Maps-Decoder"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.3",
    "ty>=0.0.72",
    "types-requests>=2.28.11.17",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    "test",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "PL", # pylint
    "PTH", # flake8-use-pathlib
    "PYI", # flake8-pyi
    "RUF", # ruff-specific-rules
    "S", # flake8-bandit
    "TC", # flake8-type-checking
    "UP", # pyupgrade
]
ignore = [
    "PLR0915",
    "RUF001",
]

[tool.mypy]
python_version = 3.14
strict = true

[tool.uv]
package = false
exclude-newer = "1 week"
