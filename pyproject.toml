[project]
name = "js-source-maps-decoder"
version = "1.0.0"
description = "JavaScript Source Maps Decoder"
authors = [
    { name = "Danil Ovchinnikov", email = "Danil42Worker@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "requests>=2.28.2,<3.0.0",
]

[project.urls]
Repository = "https://github.com/DanilBox/JavaScript-Source-Maps-Decoder"

[dependency-groups]
dev = [
    "black>=23.3.0,<24.0.0",
    "isort>=5.12.0,<6.0.0",
    "mypy>=1.2.0,<2.0.0",
    "types-requests>=2.28.11.17,<3.0.0",
]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
line_length = 120
profile = "black"

[tool.mypy]
python_version = 3.11
strict = true

[tool.uv]
package = false
